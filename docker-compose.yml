version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: db_wallet_digital
    ports:
      - "5432:5432"
    volumes:
      - pg_platform_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d db_wallet_digital"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eks-local-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=admin
      - SONAR_JDBC_PASSWORD=admin
      - SONAR_JDBC_URL=jdbc:postgresql://postgres-db:5432/db_wallet_digital
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - eks-local-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    networks:
      - eks-local-network

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - eks-local-network

  ms-wallet-digital:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-wallet-digital
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/db_wallet_digital
      - SPRING_DATASOURCE_USERNAME=platform_admin
      - SPRING_DATASOURCE_PASSWORD=secure_password
      - EKS_POD_NAME=ms-wallet-digital-local-pod
      - EKS_NAMESPACE=finance
    networks:
      - eks-local-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - eks-local-network

volumes:
  pg_platform_data:
    driver: local

networks:
  eks-local-network:
    driver: bridge